<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drum Loop Station</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Drum Loop Station</h1>
  <button id="mapBtn">Key mapping</button>
</header>
<nav>
  <button id="tabLoop" class="tab on">Loop Station</button>
  <button id="tabSeq" class="tab">Sequencer</button>
</nav>

<section id="loopPanel" class="panel">
  <div id="loopSlots" class="slots"></div>
  <div id="loopTl" class="tl"><div id="loopHead" class="head"></div></div>
  <div id="loopPos" class="pos">0.00 / 0.00 s</div>
  <div class="ctl">
    <button id="lRec">Record</button>
    <button id="lPlay">Play / Stop</button>
    <button id="lOver">Overdub</button>
    <button id="lStop">Stop</button>
    <button id="lClr">Clear selected</button>
    <button id="lClrAll">Clear all</button>
    <button id="lMet">Metronome</button>
    <label>BPM <input id="lBpm" type="number" min="60" max="180"></label>
    <label>Bars <select id="lBars"></select></label>
    <label>Quantize <select id="lQ"></select></label>
  </div>
</section>

<section id="seqPanel" class="panel" hidden>
  <div id="seqSlots" class="slots"></div>
  <div class="ctl">
    <button id="sPlay">Play / Pause</button>
    <button id="sPlayAll">Play all</button>
    <button id="sStopAll">Stop all</button>
    <button id="sMet">Metronome</button>
    <label>BPM <input id="sBpm" type="number" min="60" max="200"></label>
    <label>Steps <select id="sSteps"></select></label>
    <label>Swing <input id="sSwing" type="range" min="0" max="60"></label>
    <label>Quantize <select id="sQ"></select></label>
  </div>
  <div class="ctl">
    <button id="sClr">Clear</button>
    <button id="sFill">Fill hi-hat</button>
    <button id="sRand">Randomize</button>
  </div>
  <div id="grid" class="grid"></div>
</section>

<section class="panel"><div id="pads" class="pads"></div></section>

<div id="modal" class="modal" hidden>
  <div class="dlg">
    <div id="mapBody"></div>
    <div class="ctl">
      <button id="mapNone">Remove all</button>
      <button id="mapDef">Restore defaults</button>
      <button id="mapClose">Close</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
